name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run rule-engine tests
        run: npm test

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Patch Android project (portrait, icons, fullscreen)
        run: |
          pip install pillow
          python3 tools/patch_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: touch-7-come-11-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk touch-7-come-11.apk
          gh release create "apk-${{ github.run_number }}" touch-7-come-11.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "APK build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}"
