# Touch 7 Come 11 - iOS build + TestFlight upload (same signing/upload pattern as Touch Music ID).
# Signing: Admin APPLE_SIGNING_* key (cloud-managed, automatic). Upload: App Manager APP_STORE_CONNECT_* key.
# TestFlight only - this workflow never submits for App Store review.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: ["claude_ios_seven_come_eleven"]

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.touch7come11.game
  TEAM_ID: 2M956232BT
  MARKETING_VERSION: "1.0"

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Engine tests
        run: npm test

      - name: Generate iOS project (Capacitor) and patch
        run: |
          npm install
          npx cap add ios
          python3 -m pip install --user pillow
          npx cap sync ios
          python3 tools/patch_ios.py

      - name: Simulator smoke test (launch + screenshot)
        continue-on-error: true
        run: |
          set -x
          cd ios/App
          DEV=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV" || true
          xcodebuild build -workspace App.xcworkspace -scheme App -configuration Debug \
            -destination "id=$DEV" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} TARGETED_DEVICE_FAMILY=1
          APP=$(find "$RUNNER_TEMP/dd" -name "App.app" -path "*Debug-iphonesimulator*" | head -1)
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" $BUNDLE_ID
          sleep 12
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/launch.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Write Admin App Store Connect API key (signing)
        env:
          API_PRIVATE_KEY: ${{ secrets.APPLE_SIGNING_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_SIGNING_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOT

      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/T7C11.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=$TEAM_ID PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} TARGETED_DEVICE_FAMILY=1

      - name: Export IPA with cloud-managed signing
        env:
          API_KEY_ID: ${{ secrets.APPLE_SIGNING_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGNING_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/T7C11.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'

      - name: Report build number
        run: echo "TestFlight build ${MARKETING_VERSION} (${{ github.run_number }}) processed for $BUNDLE_ID"
